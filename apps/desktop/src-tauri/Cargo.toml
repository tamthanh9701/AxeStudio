[package]
name = "als-desktop"
version.workspace = true
edition.workspace = true
description = "AxeStudio desktop shell (Tauri 2)"
# Crate này có HAI bin: `als-desktop` (app) và `export-bindings` (tool bindings).
# Tauri CLI chạy dev bằng `cargo run` TRƠN (không kèm --bin), nên thiếu dòng
# này `pnpm tauri dev` chết ngay: "could not determine which binary to run".
# `pnpm bindings:generate` không bị ảnh hưởng — nó đã gọi rõ --bin export-bindings.
default-run = "als-desktop"

[lib]
name = "als_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-specta.workspace = true
specta.workspace = true
# Exporter TS của specta — KHÁC dòng version với specta core: specta đi kênh
# 2.0.0-rc.*, còn specta-typescript đi dãy 0.0.x (mới nhất 0.0.12).
# PHẢI ở [dependencies], KHÔNG phải dev: nó được dùng bởi bin target
# src/bin/export-bindings.rs, mà bin không nhận dev-dependencies (chỉ test/
# example/bench mới nhận). Để ở dev thì `pnpm bindings:generate` sẽ fail.
specta-typescript = "0.0"
als-core.workspace = true
als-project.workspace = true
als-assets.workspace = true
als-audio.workspace = true
als-media.workspace = true
als-orchestrator.workspace = true
als-provider.workspace = true
als-provider-cpp.workspace = true
als-provider-py.workspace = true
# Ghi WAV TRỰC TIẾP trong chính crate này ở hai chỗ:
# assets_io::encode_wav_f32 → WAV 32-bit float (asset sau normalize 48k)
# player::bounce → WAV 24-bit PCM (export bản mix cuối)
# Rust KHÔNG kế thừa dependency: als-audio/als-media có hound cũng không đưa
# `hound` vào scope ở đây. Thiếu dòng dưới = E0433 ×6.
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
