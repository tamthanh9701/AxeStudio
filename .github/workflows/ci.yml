name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  bindings-drift:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerate rồi so với bản đã commit. Lệch → fail.
      - run: pnpm bindings:check

  desktop-build:
    # Build thật shell Tauri (debug) để bắt lỗi tích hợp IPC/bundling sớm.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle

  bench:
    # GitHub-hosted không có GPU. Runner này là máy dev tự host.
    # LƯU Ý cơ chế GitHub Actions: job không khớp runner label thì KẸT
    # "queued" vô hạn, KHÔNG tự skip như comment cũ từng nghĩ. Vì vậy job
    # được gate bằng repo variable: chỉ khi bật GPU_BENCH_ENABLED=true
    # (Settings → Secrets and variables → Actions → Variables) thì job mới
    # tồn tại; mặc định skip sạch. Bật khi self-hosted runner online.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.GPU_BENCH_ENABLED == 'true'
    runs-on: [self-hosted, windows, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cargo bench ghi bencher ra stdout; collect-bench gom thành perf-report.json.
      # Chỉ số đo ngoài cargo (timeline fps, cold start...) bổ sung qua --extra
      # khi các sprint tương ứng viết script đo của chúng.
      # --output-format bencher KHÔNG truyền được qua `--` cho toàn workspace:
      # unit-test harness chỉ nhận pretty|terse|json → chết target đầu tiên.
      # Chạy đích danh từng bench (harness=false, tự in dòng bencher).
      - name: cargo bench → perf-report.json
        shell: pwsh
        run: |
          $benches = @(
            "als-audio/stream_cb",
            "als-assets/peaks_3min",
            "als-orchestrator/cache_hit"
          )
          $all = ""
          foreach ($b in $benches) {
            $pkg, $name = $b.Split("/")
            $all += (cargo bench -p $pkg --bench $name 2>$null | Out-String)
          }
          $all | node scripts/collect-bench.mjs
      - name: Soi ngân sách hiệu năng
        run: node scripts/bench-perf-budget.mjs
