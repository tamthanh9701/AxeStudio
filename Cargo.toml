# ACE Local Studio — workspace Rust. Mọi crate nội bộ nằm ở crates/*,
# shell desktop ở apps/desktop/src-tauri.

[workspace]
resolver = "2"
members = [
    "crates/als-core",
    "crates/als-project",
    "crates/als-assets",
    "crates/als-audio",
    "crates/als-media",
    "crates/als-orchestrator",
    "crates/als-provider",
    "crates/als-provider-cpp",
    "crates/als-provider-py",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
authors = ["tamthanh9701 <tamlemai0907@jultee.io.vn>"]
license = "UNLICENSED" # private cho tới khi chốt quyết định free/paid (plan §15)
repository = "https://github.com/tamthanh9701/AxeStudio"

[workspace.dependencies]
# Nội bộ
als-core = { path = "crates/als-core" }
als-project = { path = "crates/als-project" }
als-assets = { path = "crates/als-assets" }
als-audio = { path = "crates/als-audio" }
als-media = { path = "crates/als-media" }
als-orchestrator = { path = "crates/als-orchestrator" }
als-provider = { path = "crates/als-provider" }
als-provider-cpp = { path = "crates/als-provider-cpp" }
als-provider-py = { path = "crates/als-provider-py" }

# Nền tảng
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7" # CancellationToken cho job cancel (provider + orchestrator)
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
unicode-normalization = "0.1"

# Project & assets
rusqlite = { version = "0.32", features = ["bundled"] }

# Audio
# Lưu ý: KHÔNG bật feature "asio" của cpal (license Steinberg — xem plan §5).
cpal = "0.15"
rtrb = "0.3"
symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "aac", "ogg"] }
rubato = "0.16"
ebur128 = "0.1"
hound = "3.5"

# Provider clients — multipart cho cpp upload audio /understand.
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Type bridge — specta 2.x hiện chỉ phát hành kênh prerelease (2.0.0-rc.*),
# nên requirement phải mở kênh rc; resolver tự chọn bộ version tương thích.
# Cargo.lock khoá bản cụ thể sau lần build đầu — commit lockfile vào repo.
# Feature "serde_json": impl specta::Type cho serde_json::Value (ProviderOverrides.extra).
specta = { version = "2.0.0-rc", features = ["derive", "serde_json"] }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }

tauri = { version = "2", features = [] }
tauri-build = "2"

# Test
proptest = "1"
tempfile = "3"

[profile.dev]
# Giữ compile nhanh; audio test không cần optimize.
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
